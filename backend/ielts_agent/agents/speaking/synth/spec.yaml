    part2_words: [270, 320]
    part3_words: [65, 95]
    speech_rate: 2.6
    errors_per_100: [0.3, 1.0]
    fluency: "trôi chảy tự nhiên, ngắt nghỉ như người bản ngữ"
    lexis: "chính xác, tự nhiên, ít lỗi chọn từ"

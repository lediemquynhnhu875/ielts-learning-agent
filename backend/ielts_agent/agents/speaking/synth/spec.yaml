    part1_words: [8, 15]
    part2_words: [60, 90]
    part3_words: [12, 22]
    speech_rate: 1.7
    errors_per_100: [14, 20]
    fluency: "rất nhiều ngắt nghỉ dài, lặp từ, thường bỏ lửng câu"
    lexis: "từ vựng rất hạn chế, lặp lại, hay dùng từ chung chung"
    grammar: "câu rất ngắn, nhiều câu vỡ, lỗi thường gây hiểu sai"
    fluency_en: "very long and frequent pauses, heavy repetition, often abandons sentences"
    lexis_en: "very limited vocabulary, repeats the same words, reaches for vague general words"
    grammar_en: "very short sentences, many broken ones, errors often block the meaning"
  4.5:
    part1_words: [12, 20]
    part2_words: [85, 110]
    part3_words: [18, 28]
    speech_rate: 1.8
    errors_per_100: [10, 15]
    fluency: "ngắt nghỉ nhiều, tự sửa lộn xộn, cần lặp lại câu hỏi"
    lexis: "hạn chế, sai dạng từ thường xuyên"
    grammar: "chủ yếu câu đơn; câu phức gần như luôn sai"
    fluency_en: "frequent pauses, messy self-corrections, needs the question repeated"
    lexis_en: "limited range, frequent word-form mistakes"
    grammar_en: "mostly simple sentences; complex ones are almost always wrong"
  5.0:
    part1_words: [15, 25]
    part2_words: [110, 140]
    part3_words: [25, 40]
    speech_rate: 2.0
    errors_per_100: [8, 12]
    fluency: "nói được liên tục nhưng chậm, nhiều lần tự sửa"
    lexis: "đủ cho chủ đề quen, lặp từ, sai dạng từ"
    grammar: "chủ yếu câu đơn; câu phức thường sai"
    fluency_en: "keeps going but slowly, corrects himself or herself often"
    lexis_en: "enough for familiar topics, repeats words, word-form mistakes"
    grammar_en: "mostly simple sentences; complex ones usually contain errors"
  5.5:
    part1_words: [20, 32]
    part2_words: [140, 175]
    part3_words: [32, 48]
    speech_rate: 2.1
    errors_per_100: [6, 9]
    fluency: "trôi chảy hơn, vẫn ngắt khi tìm từ"
    lexis: "phạm vi hạn chế nhưng đủ diễn đạt ý chính"
    grammar: "cố dùng câu phức nhưng sai thường xuyên"
    fluency_en: "more connected, still pauses while searching for words"
    lexis_en: "limited range but enough to get the main idea across"
    grammar_en: "tries complex sentences but gets them wrong often"
  6.0:

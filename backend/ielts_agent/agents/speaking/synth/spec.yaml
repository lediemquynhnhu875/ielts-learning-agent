# Lưới sinh dữ liệu Speaking — phần P6a/P6b/P7/P10 của generate-format.docx v1.0.
# Mọi con số ở đây là tham số thiết kế, KHÔNG phải điểm chuẩn (quy định 1.5.3).
# Band thật chỉ đến từ gold_label do giáo viên chấm.
version: speaking-synth-1.0
seed: 20261030

models:
  # Generator và judge phải khác họ (mục 2.6: self-preference bias).
  generator: qwen/qwen3.8-27b
  generator_fallback: openai/gpt-oss-120b
  # Giới hạn đã khai báo: chỉ có 3 model trên Groq free, cả hai model mạnh
  # đang là grader A/B của hệ thống. Judge chọn gpt-oss-20b để khác họ với
  # generator và khác grader A; vẫn cùng họ grader B — ghi rõ trong báo cáo.
  judge: openai/gpt-oss-20b
  judge_fallback: openai/gpt-oss-120b

limits:
  # Groq free tier đo riêng từng model: 8.000 token/phút, 200.000 token/ngày.
  tokens_per_minute: 8000
  # Hạn mức thứ ba, không có trong .env, phát hiện qua 429 "on output tokens
  # per minute (OTPM): Limit 1000". Đây là hạn mức chặt nhất và là lý do P6a
  # phải tách theo từng Part.
  output_tokens_per_minute: 1000
  tokens_per_day: 200000
  max_attempts: 3
  repair_rounds: 2

criteria: [FC, LR, GRA]   # PR = not_assessed ở chế độ text (UC-03)

bands: [4.0, 4.5, 5.0, 5.5, 6.0, 6.5, 7.0, 7.5, 8.0]

# Hồ sơ đặc trưng theo band. Giả thuyết khởi điểm, hiệu chỉnh sau pilot (mục 2.4).

<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Writing Lab</title>
<style>body{font:16px system-ui;background:#eff5f5;color:#18343a;max-width:1000px;margin:40px auto;padding:20px}textarea,select,button{font:inherit}textarea{box-sizing:border-box;width:100%;padding:14px;border:1px solid #aac1c4;border-radius:10px}section{background:white;padding:24px;margin:20px 0;border-radius:16px}button{background:#126b65;color:white;border:0;border-radius:8px;padding:12px 24px;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}label{display:block;margin:14px 0 8px}.badge{background:#fff0cb;padding:12px;border-radius:8px}h1{font-size:38px;margin-bottom:6px}mark{background:#fff0cb}small{color:#49616a}</style>
<h1>Writing Lab</h1><p>Task 2 · Hai giám khảo · Kiểm chứng dẫn chứng</p><p class="badge">Chế độ demo dùng điểm cố định để kiểm luồng. Điểm thật cần cấu hình model và rubric; chưa được hiệu chỉnh với giáo viên.</p>
<section><label for="mode">Chế độ</label><select id="mode"><option value="demo">Demo kỹ thuật — không đánh giá band</option><option value="live">Chấm thật qua API đã cấu hình</option></select><label for="prompt">Đề bài</label><textarea id="prompt" rows="3">Some people believe universities should focus on practical skills rather than theoretical knowledge. To what extent do you agree or disagree?</textarea><label for="essay">Bài viết</label><textarea id="essay" rows="12" placeholder="Nhập bài viết bằng tiếng Anh..."></textarea><p><small id="count">0 từ</small></p><button id="submit">Chạy hai giám khảo</button><p id="status" role="status"></p></section><section id="result" hidden><h2>Kết quả</h2><p id="score"></p><div id="criteria"></div><details><summary>JSON và trace từng bước</summary><pre id="json"></pre></details><p><button id="download">Tải JSON</button></p></section>
<script>const $=id=>document.getElementById(id);let last; $('essay').oninput=()=>{$('count').textContent=($('essay').value.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g)||[]).length+' từ'};$('submit').onclick=async()=>{$('submit').disabled=true;$('status').textContent='Đang xử lý...';$('result').hidden=true;try{let r=await fetch('/api/assess',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:$('mode').value,prompt_text:$('prompt').value,essay_text:$('essay').value})});last=await r.json();if(!r.ok)throw Error(last.error);$('result').hidden=false;$('score').textContent=last.status==='demo'?'DEMO: hoàn tất kiểm luồng; không có band năng lực.':last.status==='failed'?'Chưa có điểm: '+last.failure:'Band Task 2 ước lượng: '+last.overall_band;$('criteria').replaceChildren();for(const c of last.criteria||[]){let h=document.createElement('h3');h.textContent=c.criterion+(last.mode==='live'?' · '+c.band:'');let p=document.createElement('p');p.textContent=c.comment;$('criteria').append(h,p);for(const e of c.evidence){let q=document.createElement('blockquote');q.textContent=e.quote;$('criteria').append(q)}}$('json').textContent=JSON.stringify(last,null,2);$('status').textContent='Hoàn thành · '+last.latency_ms+' ms'}catch(e){$('status').textContent=e.message}finally{$('submit').disabled=false}};$('download').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify(last,null,2)],{type:'application/json'}));let a=document.createElement('a');a.href=u;a.download='writing-result.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)};</script></html>
